<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Foco</title>

    <link rel="icon" type="image/png" href="assets/images/Icone.ico"> 
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <main class="container">
        <h1>Gerador de Foco - FocoWave</h1>
        
        <div id="cycle-counter">Ciclo: 0 de 4</div>

        <div class="timer">
            <span id="timer-display">25:00</span>
        </div>

        <div class="time-config">
            
            <div class="time-group">
                <label for="focus-input">Focar (min):</label>
                <input type="number" id="focus-input" data-mode="focus" min="1" max="180" value="25">
            </div>

            <div class="time-group">
                <label for="short-input">Pausa Curta (min):</label>
                <input type="number" id="short-input" data-mode="short" min="1" max="60" value="5">
            </div>

            <div class="time-group">
                <label for="long-input">Pausa Longa (min):</label>
                <input type="number" id="long-input" data-mode="long" min="1" max="180" value="15">
            </div>
            
        </div>
        
        <div class="controls">
            <button id="btn-start-pause">Iniciar Foco</button>
            <button id="btn-reset">Reiniciar</button>
        </div>

        <div class="sound-picker">
            <h3>Som de Fundo:</h3>
            <button class="sound-btn active" data-sound="none">Nenhum</button>
            <button class="sound-btn" data-sound="rain">Chuva</button>
            <button class="sound-btn" data-sound="cafe">Cafeteria</button>
            <button class="sound-btn" data-sound="noise">Ruído Branco</button>
            
            <button class="sound-btn" data-sound="piano">Piano</button>
            <button class="sound-btn" data-sound="nature">Natureza</button>

            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
        </div>
    </main>

    <audio id="audio-rain" src="assets/sound/chuva.mp3" loop></audio>
    <audio id="audio-cafe" src="assets/sound/cafeteria.mp3" loop></audio>
    <audio id="audio-noise" src="assets/sound/ruido.mp3" loop></audio>
    <audio id="audio-piano" src="assets/sound/Piano_Relaxante.mp3" loop></audio>
    <audio id="audio-nature" src="assets/sound/natureza.mp3" loop></audio>
    <audio id="audio-alert" src="assets/sound/notificacao.mp3"></audio>

    <script src="assets/js/script.js"></script>
</body>
</html>
